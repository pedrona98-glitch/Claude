<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#101a2e">
  <title>Sky Squadron Idle</title>
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="cur" title="Monete"><span>🪙</span><b id="coins">0</b></div>
      <div class="cur" title="Gemme"><span>💎</span><b id="gems">0</b></div>
      <div class="cur" title="Medaglie"><span>🎖️</span><b id="medals">0</b></div>
      <button id="btn-settings" aria-label="Impostazioni">⚙️</button>
    </header>

    <section id="battle">
      <canvas id="sky"></canvas>
      <div id="stagebar">
        <div class="stage-line"><b id="stage-name"></b><span id="stage-info"></span></div>
        <div id="hp"><div id="hp-fill"></div><span id="hp-text"></span></div>
      </div>
      <div id="banner"></div>
      <div id="tap-hint"></div>
      <button id="boost-chip" hidden></button>
      <button id="btn-boss" hidden></button>
      <div id="dps"></div>
    </section>

    <main id="panel"></main>
    <nav id="tabs"></nav>
    <div id="toasts"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
